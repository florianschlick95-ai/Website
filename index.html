<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Battle Cats Ferien – Tabs Edition</title>

<style>
body {
    margin: 0;
    font-family: "Trebuchet MS", system-ui, sans-serif;

    /* HELLER NACHT-HIMMEL FARBVERLAUF */
    background: linear-gradient(
        180deg,
        #1a2758,
        #233a7a,
        #2f4aa0,
        #0a0f2c
    );
    background-attachment: fixed;
    background-size: cover;

    color: #fff;
    overflow-x: hidden;
}

/* TAB BAR */
#tabBar {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 20px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 100;
}

/* Holz-Button-Stil */
.tab-btn {
    padding: 15px 35px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 18px;

    background: linear-gradient(180deg, #d49a5c, #9c6a33);
    color: #ffe98a;
    text-shadow: 2px 2px 0px #000;

    box-shadow:
        0 0 0 4px #5a3a1a inset,
        0 0 15px rgba(0,0,0,0.6),
        0 6px 0 #5a3a1a;

    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;

    display: flex;
    align-items: center;
    gap: 10px;
}

/* Ranken-Effekt */
.tab-btn::before {
    content: "";
    position: absolute;
    top: -8px;
    left: -8px;
    width: 120%;
    height: 120%;
    background: url('https://i.imgur.com/8eQJYkP.png');
    background-size: cover;
    opacity: 0.35;
    pointer-events: none;
}

/* Hover */
.tab-btn:hover {
    transform: scale(1.08);
    box-shadow:
        0 0 0 4px #5a3a1a inset,
        0 0 25px rgba(255,255,0,0.7),
        0 6px 0 #5a3a1a;
}

/* Aktiver Tab */
.tab-active {
    background: linear-gradient(180deg, #ffcc66, #c68c53);
    color: #fff;
    text-shadow: 2px 2px 0px #000;
}

/* SEITEN */
.page {
    display: none;
    padding: 40px;
}

/* GAME */
.enemy-box {
    margin: 20px auto;
    padding: 20px;
    width: 350px;
    background: rgba(0,0,0,0.6);
    border: 3px solid white;
    border-radius: 20px;
    box-shadow: 0 0 20px white;
    transition: transform 0.2s;

    user-select: none;
}

.enemy-box * {
    user-select: none;
}

.enemy-box:hover {
    transform: scale(1.05);
    cursor: pointer;
}

/* Gegnerbild */
.enemy-img {
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
}

.enemy-color-layer {
    height: 10px;
    margin-top: 10px;
    background: linear-gradient(90deg, white, black, blue, red, purple);
    border-radius: 5px;
}

.enemy-hp {
    margin-top: 10px;
    font-size: 20px;
}

/* ⭐ HELLERE MINECRAFT XP LEISTE */
.mc-xp-container {
    margin-bottom: 20px;
    text-align: center;
}

.mc-xp-bar {
    width: 100%;
    height: 22px;
    background: #4a4a4a; /* heller */
    border: 3px solid #1a1a1a; /* heller Rahmen */
    border-radius: 12px;
    overflow: hidden;
    box-shadow: inset 0 0 4px #000;
}

#mcXpFill {
    height: 100%;
    width: 0%;
    background: #00ff4a; /* helleres Minecraft-Grün */
    transition: width 0.3s ease;
}

#mcXpText {
    margin-top: 6px;
    font-size: 20px;
    font-weight: bold;
    color: #00ff4a; /* heller */
    text-shadow: 0 0 4px #00ff4a;
}

/* TAGEBUCH */
.card {
    background: rgba(0,0,0,0.55);
    border: 3px solid #ffea00;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 25px rgba(255,255,0,0.4);
    backdrop-filter: blur(8px);
    margin: 20px;
}

.entry {
    background: rgba(0,0,0,0.6);
    border: 2px solid #ffea00;
    border-radius: 15px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 0 15px rgba(255,255,0,0.4);
    position: relative;
}
</style>
</head>

<body>

<!-- SOUND -->
<audio id="soundXp" src="xp.mp3"></audio>
<audio id="bgMusic" src="battlecats.mp3" loop autoplay></audio>

<!-- TAB BAR -->
<div id="tabBar">
    <button class="tab-btn tab-active" onclick="openTab('gamePage', this)">
        🎮 PLAY
    </button>

    <button class="tab-btn" onclick="openTab('diaryPage', this)">
        📘 DIARY
    </button>
</div>

<!-- SPIEL -->
<section id="gamePage" class="page" style="display:block;">
    <h2>Cat vs Enemy – Minigame</h2>

    <div class="enemy-box" onclick="hitEnemy()">

        <img src="img/enemy.png" class="enemy-img">

        <h3 id="enemyName">Bun Bun Black</h3>
        <div class="enemy-color-layer"></div>
        <div class="enemy-hp" id="enemyHp">HP: 100</div>
    </div>

    <div class="mc-xp-container">
        <div class="mc-xp-bar">
            <div id="mcXpFill"></div>
        </div>
        <div id="mcXpText">0 XP</div>
    </div>
</section>

<!-- TAGEBUCH -->
<section id="diaryPage" class="page">
    <h2>Neuer Eintrag</h2>

    <label>Tag</label>
    <select id="daySelect">
        <option>Montag</option><option>Dienstag</option><option>Mittwoch</option>
        <option>Donnerstag</option><option>Freitag</option><option>Samstag</option><option>Sonntag</option>
    </select>

    <label>Highlight</label>
    <textarea id="highlightInput"></textarea>

    <label>Lowlight</label>
    <textarea id="lowlightInput"></textarea>

    <label>Stimmung (1–10)</label>
    <input id="scoreInput" type="number" min="1" max="10" value="7">

    <label>Notizen</label>
    <textarea id="noteInput"></textarea>

    <button id="addEntryBtn">Eintrag speichern 🐾</button>

    <h2>Deine Woche</h2>
    <div id="entryList"></div>
</section>

<script>
/* TAB SWITCH */
function openTab(page, btn) {
    document.querySelectorAll('.page').forEach(p => p.style.display = "none");
    document.getElementById(page).style.display = "block";

    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove("tab-active"));
    btn.classList.add("tab-active");
}

/* GAME */
let enemyHp = 100;
let xp = 0;

const enemies = ["Bun Bun Black", "Kory", "Bore", "Le’Grim", "R. Ost"];

function hitEnemy() {
    enemyHp -= 10;
    document.getElementById("soundXp").play();
    document.getElementById("enemyHp").textContent = "HP: " + enemyHp;

    xp += 5;
    updateXp();

    if (enemyHp <= 0) {
        const newEnemy = enemies[Math.floor(Math.random() * enemies.length)];
        document.getElementById("enemyName").textContent = newEnemy;
        enemyHp = 100;
        document.getElementById("enemyHp").textContent = "HP: 100";
    }
}

function updateXp() {
    const percent = Math.min(xp, 100);
    document.getElementById("mcXpFill").style.width = percent + "%";
    document.getElementById("mcXpText").textContent = xp + " XP";
}

/* TAGEBUCH */
const entries = [];

document.getElementById("addEntryBtn").addEventListener("click", () => {
    const entry = {
        day: daySelect.value,
        highlight: highlightInput.value,
        lowlight: lowlightInput.value,
        score: scoreInput.value,
        note: noteInput.value
    };

    entries.push(entry);
    document.getElementById("soundXp").play();
    renderEntries();
});

function renderEntries() {
    entryList.innerHTML = "";

    for (const e of entries) {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
            <strong>${e.day}</strong><br>
            ${e.highlight ? "✨ Highlight: " + e.highlight + "<br>" : ""}
            ${e.lowlight ? "👹 Lowlight: " + e.lowlight + "<br>" : ""}
            ${e.note ? "📝 " + e.note : ""}
        `;
        entryList.appendChild(div);
    }
}
</script>

</body>
</html>
